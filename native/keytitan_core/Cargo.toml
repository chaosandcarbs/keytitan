[package]
name = "keytitan_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "keytitan_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.2"
sha2 = "0.10"
zeroize = "1.8"
