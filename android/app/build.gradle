plugins { 
    id "com.android.application" 
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file('key.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def signingConfigured = requiredSigningProperties.every {
    releaseSigningProperties.getProperty(it)?.trim()
}

android {
    namespace = "app.keytitan"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "app.keytitan"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (signingConfigured) {
                storeFile = rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword = releaseSigningProperties.getProperty('storePassword')
                keyAlias = releaseSigningProperties.getProperty('keyAlias')
                keyPassword = releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

def validateReleaseSigningSetup = tasks.register('validateReleaseSigningSetup') {
    doLast {
        if (!signingConfigured) {
            throw new GradleException('Release signing is required. Copy android/key.properties.example to android/key.properties and configure a production keystore.')
        }
        def configuredStore = rootProject.file(releaseSigningProperties.getProperty('storeFile'))
        if (!configuredStore.isFile() || configuredStore.name.equalsIgnoreCase('debug.keystore') ||
            releaseSigningProperties.getProperty('keyAlias').equalsIgnoreCase('androiddebugkey')) {
            throw new GradleException('Release signing requires an existing production keystore and a non-debug key alias.')
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.autofill:autofill:1.3.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "org.robolectric:robolectric:4.16.1"
}

// Flutter copies assets after AGP's asset merge. AGP 9 host-test packaging also
// consumes that directory and needs the explicit producer dependency.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn(validateReleaseSigningSetup)
    if (task.name.startsWith("package") && task.name.endsWith("UnitTestForUnitTest")) {
        def variant = task.name.substring("package".length()).replaceFirst(/UnitTestForUnitTest$/, "")
        task.dependsOn(tasks.matching { it.name == "copyFlutterAssets${variant}" })
    }
}
